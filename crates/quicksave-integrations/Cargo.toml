[package]
name = "quicksave-integrations"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Read-only application discovery and truthful QuickSave integration contracts"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The bounded event API is upstream's explicitly unstable surface. Restrict its
# minor version, as recommended by plist, rather than allow silent API changes.
plist = { version = "~1.10.4", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
