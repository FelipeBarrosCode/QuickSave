name: Desktop builds and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate repository and target matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/verify_repository.py
      - run: python -m unittest discover -s tests -v
      - id: matrix
        name: Load audited native target matrix
        shell: bash
        run: |
          python -c 'import json; from pathlib import Path; print("matrix=" + json.dumps({"include": json.loads(Path(".github/desktop-targets.json").read_text())}, separators=(",", ":")))' >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.name }} native tests and unsigned packages
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Preserve audited source bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify this is a native runner, not a cross-check
        run: python scripts/check_ci_native_host.py "${{ matrix.target }}"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libelf-dev zlib1g-dev clang llvm libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Verify provenance on the target OS
        run: python scripts/verify_repository.py

      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test frontend
        working-directory: apps/desktop
        run: |
          mkdir -p ../../artifacts/ci
          npm test -- --reporter=default --reporter=junit --outputFile.junit=../../artifacts/ci/frontend.xml

      - name: Build and typecheck frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Run native Rust workspace tests
        run: |
          mkdir -p artifacts/ci
          cargo test --locked --workspace --all-targets --target "${{ matrix.target }}" -- --test-threads=1 2>&1 | tee artifacts/ci/rust-workspace.log

      - name: Run native desktop unit tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.target }}" --bin quicksave-desktop -- --test-threads=1 2>&1 | tee artifacts/ci/rust-desktop.log

      - name: Build unsigned native packages
        working-directory: apps/desktop
        run: npm run build:native -- --ci --no-sign --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked

      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: quicksave-${{ matrix.name }}-unsigned-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: Retain test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 7
