name: Hourly desktop CI health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const branch = await github.rest.repos.getBranch({...repo, branch: "main"});
            const runs = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: "desktop-build.yml", branch: "main",
              event: "push", per_page: 1
            });
            const run = runs.data.workflow_runs[0];
            if (!run || run.head_sha !== branch.data.commit.sha) {
              core.setFailed("There is no desktop build for the current main commit.");
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: run.id, per_page: 100
            });
            await core.summary
              .addHeading("Desktop CI health")
              .addLink("Latest main build", run.html_url)
              .addRaw(`\n\nCommit: ${run.head_sha}\n\n`)
              .addTable([
                [{data: "Job", header: true}, {data: "State", header: true}],
                ...jobs.map(job => [job.name, job.conclusion || job.status])
              ]).write();
            if (run.status !== "completed") {
              core.notice("The latest build is still running; success is not confirmed.");
            } else if (run.conclusion !== "success") {
              core.setFailed(`Latest main build is ${run.conclusion}: ${run.html_url}`);
            } else {
              core.notice("The latest main desktop build and test matrix passed.");
            }
