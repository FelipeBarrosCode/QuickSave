[package]
name = "quicksave-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "QuickSave native desktop development preview"

[workspace]

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
quicksave-client = { path = "../../../crates/quicksave-client" }
quicksave-control = { path = "../../../crates/quicksave-control" }
quicksave-platform = { path = "../../../crates/quicksave-platform" }
quicksave-integrations = { path = "../../../crates/quicksave-integrations" }
quicksave-service = { path = "../../../crates/quicksave-service" }
quicksave-state = { path = "../../../crates/quicksave-state" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
