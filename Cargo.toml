[workspace]
resolver = "2"
members = [
  "crates/quicksave-platform",
  "crates/quicksave-content",
  "crates/quicksave-engine",
  "crates/quicksave-client",
  "crates/quicksave-control",
  "crates/quicksave-integrations",
  "crates/quicksave-cli",
  "crates/quicksave-state",
  "crates/quicksave-tracking",
  "crates/quicksave-noland",
  "crates/quicksave-service",
  "crates/quicksave-oauth",
  "crates/quicksave-observation",
]
exclude = ["upstream/no-land/state-agent", "shared-storage", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.24.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
rand = "0.8"
tempfile = "3"
libc = "0.2"
quicksave-platform = { path = "crates/quicksave-platform" }
quicksave-content = { path = "crates/quicksave-content" }
quicksave-engine = { path = "crates/quicksave-engine" }
quicksave-client = { path = "crates/quicksave-client" }
quicksave-control = { path = "crates/quicksave-control" }
quicksave-integrations = { path = "crates/quicksave-integrations" }
quicksave-observation = { path = "crates/quicksave-observation" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
